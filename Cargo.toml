[package]
name = "jayos-moonlander"
description = "ZSA Moonlander support for the JayOS shell: Keymapp's layer names and layout, the plug and layer popups, kontroll's commands and the udev rule that opens the board"
# VERSION says the same; tests/shell/test-packaging.sh holds the two equal,
# since a release is VERSION's and the binaries report this one.
version = "1.0.0"
edition = "2021"
# jayos's workspace floor, which these binaries were built under before the move.
rust-version = "1.85"
license = "MIT"
resolver = "3"
repository = "https://github.com/Jadocee/jayos-moonlander"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# SQLite, for jayos-keymapp-layers. Keymapp keeps the layout it flashed in its
# own database and that is the only local source for the layer NAMES; the shell
# read it by shelling to sqlite3, which made a CLI that is not installed by
# default the difference between "Symbols" and "layer 3". `bundled` compiles
# SQLite itself, as jayos's workspace had it: this is built on a machine that
# may not have the development headers, and its version is the lockfile's.
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# As jayos's workspace had them: helpers whose reason to be Rust is starting
# fast, built once at install time, so slower builds cost nobody twice.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
